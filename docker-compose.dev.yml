# ==================================================
# automateCRM — Docker Compose Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==================================================

name: automatecrm

services:
  app:
    build:
      target: production
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules

  # ---- phpMyAdmin ----
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: automatecrm-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "8081:80"
    networks:
      - automatecrm-network

  # ---- Redis Commander (Redis GUI) ----
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: automatecrm-redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    networks:
      - automatecrm-network
