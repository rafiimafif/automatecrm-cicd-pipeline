<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Connectivity/Neural Nodes -->
  <g transform="translate(10, 10)">
    <circle cx="15" cy="30" r="6" fill="white" />
    <circle cx="45" cy="15" r="5" fill="white" />
    <circle cx="45" cy="45" r="5" fill="white" />
    <circle cx="75" cy="30" r="6" fill="white" />

    <line x1="15" y1="30" x2="45" y2="15" stroke="white" stroke-width="2" />
    <line x1="15" y1="30" x2="45" y2="45" stroke="white" stroke-width="2" />
    <line x1="45" y1="15" x2="75" y2="30" stroke="white" stroke-width="2" />
    <line x1="45" y1="45" x2="75" y2="30" stroke="white" stroke-width="2" />
    <line x1="45" y1="15" x2="45" y2="45" stroke="white" stroke-width="2" />

    <circle cx="45" cy="30" r="3" fill="white" opacity="0.6" />
  </g>

  <!-- Text: Using textLength to force it to be exactly 150px wide, no matter the OS font rendering -->
  <text x="90" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="white" textLength="150" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#d0d0d0">automate</tspan>CRM
  </text>
</svg>
