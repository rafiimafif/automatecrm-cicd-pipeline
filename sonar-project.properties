sonar.organization=rafiimafif
sonar.projectKey=rafiimafif_automateCRM
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=automateCRM
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=app,resources/js,resources/css
sonar.tests=tests
sonar.php.tests.reportPath=coverage.xml
sonar.php.coverage.reportPaths=coverage.xml

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,database/migrations/**
