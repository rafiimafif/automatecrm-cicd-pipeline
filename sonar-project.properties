# =============================================
# automateCRM — SonarQube / SonarCloud Configuration
# =============================================

sonar.projectKey=rafiimafif_automateCRM
sonar.projectName=automateCRM
sonar.projectVersion=1.0.0
sonar.organization=rafiimafif

# Source configuration
sonar.sources=app
sonar.tests=tests
sonar.language=php
sonar.sourceEncoding=UTF-8

# PHP specific
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=tests/results/junit.xml

# Exclusions
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/vendor/**,\
  public/build/**,\
  public/css/sb-admin-2*.css,\
  storage/**,\
  bootstrap/cache/**,\
  database/migrations/**,\
  resources/vendor/**,\
  docker/**,\
  terraform/**,\
  *.min.js,\
  *.min.css

sonar.test.exclusions=\
  tests/**

sonar.coverage.exclusions=\
  config/**,\
  database/**,\
  resources/**,\
  routes/**,\
  bootstrap/**,\
  app/Console/Kernel.php,\
  app/Exceptions/Handler.php,\
  app/Providers/**

# Quality Gate
sonar.qualitygate.wait=true
